name: API validation

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'r2-worker/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'r2-worker/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Node.js API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check auth_routes.js
          node --input-type=module --check < ../r2-worker/src/index.js

      - name: Verify package metadata
        run: npm pkg get name version scripts dependencies
